<style>

  --pink:        #f4b9d7;
  --pink-light:  #fde8f3;
  --pink-dark:   #c06090;
  --pink-deep:   #8a3a6e;

  --border:      #ead8ea;

  --white:       #ffffff;
  --green:       #4a8050;

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--cream);
  color: var(--text);

}
#root { min-height: 100vh; }

/* ── LAYOUT ── */
.page { max-width: 480px; margin: 0 auto; padding: 24px 16px 80px; }
.page-wide { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

/* ── HEADER ── */
.site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header-logo {
  display: flex; align-items: center; gap: 10px;
}
.header-mark {
  width: 32px; height: 32px;
}
.header-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 500; color: var(--pink-deep);
}
.header-link {
  font-size: 12px; color: var(--text-light); cursor: pointer;
  text-decoration: underline; background: none; border: none;
  font-family: 'Jost', sans-serif;
}
.header-link:hover { color: var(--pink-dark); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 13px 24px; border-radius: 100px;
  font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; border: none; transition: all 0.15s; text-align: center;
}
.btn-primary {
  background: linear-gradient(135deg, #e87ab0 0%, #b095d0 100%);
  color: var(--white);
  box-shadow: 0 4px 16px rgba(200,120,170,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,120,170,0.4); }
.btn-secondary {
  background: var(--white); color: var(--pink-deep);
  border: 1.5px solid var(--pink);
}
.btn-secondary:hover { background: var(--pink-light); }
.btn-ghost {
  background: transparent; color: var(--text-mid);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--white); }
.btn-danger { background: var(--red-light); color: var(--red); border: 1px solid #f0c0c0; }
.btn-sm { padding: 8px 16px; font-size: 12px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* ── CARDS ── */
.card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 20px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 12px; }
.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 500; color: var(--text);
  margin-bottom: 4px;
}
.card-sub { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }

/* ── FORMS ── */
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-mid); letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 6px;
}
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-family: 'Jost', sans-serif; font-size: 14px; color: var(--text);
  background: var(--white); outline: none; transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--pink-dark);
}
.field textarea { resize: vertical; min-height: 80px; }
.field-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* ── HERO ── */
.hero { text-align: center; padding: 48px 20px 32px; }
.hero-mark { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 40px; font-weight: 600; color: var(--text);
  line-height: 1.1; margin-bottom: 8px;
}
.hero-title span { color: var(--pink-dark); font-style: italic; }
.hero-sub { font-size: 14px; color: var(--text-mid); line-height: 1.7; margin-bottom: 32px; max-width: 320px; margin-left: auto; margin-right: auto; }
.hero-actions { display: flex; flex-direction: column; gap: 10px; max-width: 280px; margin: 0 auto; }
.hero-week {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--pink-light); color: var(--pink-deep);
  border-radius: 100px; padding: 6px 14px; font-size: 12px;
  font-weight: 500; margin-bottom: 24px;
}

/* ── DAY CARDS ── */
.day-grid { display: flex; flex-direction: column; gap: 10px; }
.day-card {
  border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--white); overflow: hidden; transition: all 0.15s;
}
.day-card.selected { border-color: var(--pink-dark); background: var(--pink-light); }
.day-card.no-menu { opacity: 0.5; pointer-events: none; }
.day-card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer;
}
.day-checkbox {
  width: 20px; height: 20px; border-radius: 6px;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.day-card.selected .day-checkbox {
  background: var(--pink-dark); border-color: var(--pink-dark);
}
.day-check-icon { display: none; }
.day-card.selected .day-check-icon { display: block; }
.day-name { font-weight: 600; font-size: 14px; flex-shrink: 0; width: 90px; }
.day-dishes { flex: 1; }
.day-main { font-size: 14px; color: var(--text); }
.day-side { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.day-tag {
  font-size: 10px; font-weight: 600; padding: 3px 8px;
  border-radius: 100px; background: var(--pink-light);
  color: var(--pink-dark); flex-shrink: 0;
}

/* ── EXTRAS ── */
.extras-grid { display: flex; flex-direction: column; gap: 8px; }
.extra-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--white);
}
.extra-info { flex: 1; }
.extra-name { font-size: 14px; font-weight: 500; }
.extra-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.extra-price { font-size: 12px; color: var(--pink-dark); font-weight: 500; flex-shrink: 0; }
.qty-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 16px; display: flex;
  align-items: center; justify-content: center; font-weight: 500;
  transition: all 0.1s; color: var(--text-mid);
}
.qty-btn:hover { border-color: var(--pink-dark); color: var(--pink-dark); }
.qty-num { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }

/* ── ORDER SUMMARY ── */
.summary-box {
  background: var(--pink-light); border: 1px solid var(--pink);
  border-radius: var(--radius); padding: 16px; margin-top: 16px;
}
.summary-title { font-size: 12px; font-weight: 600; color: var(--pink-deep); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.summary-row.total { font-weight: 600; border-top: 1px solid var(--pink); padding-top: 8px; margin-top: 4px; font-size: 14px; }
.summary-empty { font-size: 13px; color: var(--text-light); text-align: center; padding: 8px 0; }

/* ── TOGGLE ── */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-top: 1px solid var(--border);
}
.toggle-label { font-size: 14px; }
.toggle-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.toggle {
  width: 44px; height: 24px; border-radius: 12px;
  background: var(--border); border: none; cursor: pointer;
  position: relative; transition: background 0.2s;
}
.toggle.on { background: var(--pink-dark); }
.toggle::after {
  content: ''; position: absolute; width: 20px; height: 20px;
  border-radius: 50%; background: white; top: 2px; left: 2px;
  transition: transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.toggle.on::after { transform: translateX(20px); }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; background: var(--cream); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
.tab-btn {
  flex: 1; padding: 10px; border: none; border-radius: 10px;

}
.tab-btn.active { background: var(--white); color: var(--pink-deep); box-shadow: var(--shadow); }

/* ── STATUS BADGES ── */
.badge {

}
.badge-pending  { background: var(--amber-light); color: var(--amber); }
.badge-confirmed { background: var(--blue-light); color: #2a5a8a; }
.badge-delivered { background: var(--green-light); color: var(--green); }

/* ── ORDERS TABLE (admin) ── */
.orders-table { width: 100%; border-collapse: collapse; }
.orders-table th {
  text-align: left; font-size: 11px; font-weight: 600;
  color: var(--text-light); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.orders-table td { padding: 12px; border-bottom: 1px solid #f5eef5; font-size: 13px; vertical-align: top; }
.orders-table tr:last-child td { border-bottom: none; }
.orders-table tr:hover td { background: var(--cream); }
.order-days { display: flex; gap: 4px; flex-wrap: wrap; }
.day-chip {
  font-size: 10px; font-weight: 500; padding: 2px 7px;
  border-radius: 6px; background: var(--pink-light); color: var(--pink-deep);
}
.status-select {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 8px; font-size: 12px; font-family: 'Jost', sans-serif;
  background: var(--white); cursor: pointer;
}

/* ── ADMIN MENU EDITOR ── */
.menu-day-editor {
  border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 16px; background: var(--white); margin-bottom: 10px;
}
.menu-day-label {
  font-weight: 600; font-size: 14px; margin-bottom: 12px;
  color: var(--pink-deep);
}
.input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-field { margin-bottom: 0; }
.mini-field label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; display: block; }
.mini-field input, .mini-field textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Jost', sans-serif; font-size: 13px; color: var(--text);
  background: var(--cream); outline: none;
}
.mini-field input:focus, .mini-field textarea:focus { border-color: var(--pink-dark); background: var(--white); }

/* ── ALERTS ── */
.alert {
  padding: 12px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.alert-error { background: var(--red-light); color: var(--red); border: 1px solid #f0c0c0; }
.alert-success { background: var(--green-light); color: var(--green); border: 1px solid #c0e0c0; }
.alert-info { background: var(--blue-light); color: #2a5a8a; border: 1px solid var(--blue); }

/* ── LOADING ── */
.loading-wrap { display: flex; align-items: center; justify-content: center; padding: 60px 20px; flex-direction: column; gap: 12px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--pink-dark); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-light); }

/* ── SUCCESS ── */
.success-wrap { text-align: center; padding: 48px 20px; }
.success-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--green-light); display: flex;
  align-items: center; justify-content: center;
  margin: 0 auto 20px; font-size: 28px;
}
.success-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin-bottom: 8px; }
.success-sub { font-size: 14px; color: var(--text-mid); line-height: 1.7; }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

/* ── SECTION HEADERS ── */
.section-head { margin: 24px 0 12px; }
.section-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; }
.section-head p { font-size: 12px; color: var(--text-light); margin-top: 2px; }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--border); margin: 20px 0; }

/* ── PREGNANCY BADGE ── */
.pregnancy-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--pink-light); color: var(--pink-deep);
  border-radius: 100px; padding: 4px 10px; font-size: 11px; font-weight: 600;
}
</style>

<script>

// ================================================================
// INIT
// ================================================================
var db = null
const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday']
const DAY_LABELS = { monday:'Monday', tuesday:'Tuesday', wednesday:'Wednesday', thursday:'Thursday', friday:'Friday', saturday:'Saturday' }

// ================================================================
// STATE
// ================================================================
let S = {
  view: 'landing',
  customer: null,
  formData: { name: '', phone: '', email: '' },
  adminWeek: null,
  allCustomers: [],
  welcomeBack: false,
  adminUser: null,
  weeklyMenu: null,
  extras: [],
  sel: { days: new Set(), extras: {}, choices: {}, notes: '', pregnancy: false },

  error: null,
  msg: null
}

// ================================================================
// HELPERS
// ================================================================
function weekStart() {
  const d = new Date()
  const day = d.getDay()
  const diff = d.getDate() - day + (day === 0 ? -6 : 1)
  return new Date(new Date().setDate(diff)).toISOString().split('T')[0]
}

function fmtWeek(ds) {
  if (!ds) return ''
  const d = new Date(ds + 'T12:00:00')
  const e = new Date(d); e.setDate(e.getDate() + 5)
  const opt = { month: 'short', day: 'numeric' }
  return `${d.toLocaleDateString('en-CA', opt)} - ${e.toLocaleDateString('en-CA', opt)}`
}

function cap(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : '' }

// Standing text shown on every menu
const MEAL_INCLUDES = 'Every meal comes with 4 rotis and a portion of jeera rice or plain rice.'

const CATEGORIES = [
  { key: 'iron',    label: 'Iron rich',    icon: '\u{1FA78}' },
  { key: 'protein', label: 'Protein rich', icon: '\u{1F4AA}' }
]

// Read a day's categories. Falls back to the old single-list format
// so menus set before this change still display.
function dayCategories(entry) {
  if (!entry) return []
  const out = []
  CATEGORIES.forEach(c => {
    const opts = (entry[c.key] || []).filter(Boolean)
    if (opts.length) out.push({ key: c.key, label: c.label, icon: c.icon, opts })
  })
  if (!out.length) {
    const legacy = (entry.options || (entry.main ? [entry.main] : [])).filter(Boolean)
    if (legacy.length) out.push({ key: 'main', label: 'Main', icon: '\u{1F35B}', opts: legacy })
  }
  return out
}

function dayHasMenu(entry) { return dayCategories(entry).length > 0 }

// "monday:iron=Palak Paneer|protein=Rajma"
function encodeDay(day, picks) {
  const parts = Object.entries(picks || {}).filter(([,v]) => v).map(([k,v]) => k + '=' + v)
  return parts.length ? day + ':' + parts.join('|') : day
}

function decodeDay(str) {
  const idx = String(str).indexOf(':')
  if (idx === -1) return { day: str, picks: {} }
  const day = str.slice(0, idx), rest = str.slice(idx + 1)
  if (!rest.includes('=')) return { day, picks: { main: rest } }
  const picks = {}
  rest.split('|').forEach(p => {
    const i = p.indexOf('=')
    if (i > 0) picks[p.slice(0, i)] = p.slice(i + 1)
  })
  return { day, picks }
}

// Human-readable list of what was picked for a day
function picksText(picks) {
  return Object.values(picks || {}).filter(Boolean).join(' + ')
}

function extraTotal() {
  return Object.entries(S.sel.extras).reduce((sum, [id, qty]) => {
    const ex = S.extras.find(e => e.id === id)
    return sum + (ex ? ex.price * qty : 0)
  }, 0)
}

// ================================================================
// DATA
// ================================================================
async function loadMenu() {
  const { data } = await db.from('weekly_menu').select('*').eq('week_start', weekStart()).maybeSingle()
  S.weeklyMenu = data
  if (data?.menu) S.menuDraft = JSON.parse(JSON.stringify(data.menu))
}

async function loadExtras() {
  const { data } = await db.from('extras').select('*').eq('available', true).order('name')
  S.extras = data || []
}

async function checkExistingOrder(phone) {
  const { data } = await db.from('orders').select('*').eq('customer_phone', phone).eq('week_start', weekStart()).maybeSingle()
  S.existingOrder = data
}

async function submitOrder() {
  const extrasArr = Object.entries(S.sel.extras).filter(([,q]) => q > 0).map(([id, qty]) => {
    const ex = S.extras.find(e => e.id === id)
    return { id, name: ex?.name || '', qty, price: ex?.price || 0 }
  })
  const daysEncoded = [...S.sel.days].map(d => encodeDay(d, S.sel.choices[d]))
  const { error } = await db.from('orders').insert({
    customer_name: S.customer.name,
    customer_phone: S.customer.phone,
    customer_email: S.customer.email || null,
    week_start: weekStart(),
    delivery_days: daysEncoded,
    extras: extrasArr,
    pregnancy_plan: S.sel.pregnancy,
    notes: S.sel.notes,
    status: 'pending'
  })
  return !error
}

async function saveMenu() {
  const wk = S.adminWeek || weekStart()
  const { error } = await db.from('weekly_menu').upsert({ week_start: wk, menu: S.menuDraft }, { onConflict: 'week_start' })
  return !error
}

// Load the menu for whichever week admin is viewing
async function loadMenuForAdmin() {
  const wk = S.adminWeek || weekStart()
  const { data } = await db.from('weekly_menu').select('*').eq('week_start', wk).maybeSingle()
  S.menuDraft = data?.menu ? JSON.parse(JSON.stringify(data.menu)) : {}
}

async function loadAllOrders() {
  const wk = S.adminWeek || weekStart()
  const { data } = await db.from('orders').select('*').eq('week_start', wk).order('created_at', { ascending: false })
  S.allOrders = data || []
}

async function loadCustomers() {
  const { data } = await db.from('customers').select('*').order('last_order_at', { ascending: false })
  S.allCustomers = data || []
}

// Shift the admin week view by n weeks
function shiftWeek(n) {
  const base = new Date((S.adminWeek || weekStart()) + 'T12:00:00')
  base.setDate(base.getDate() + n * 7)
  S.adminWeek = base.toISOString().split('T')[0]
}

async function updateStatus(id, status) {
  await db.from('orders').update({ status }).eq('id', id)
  await loadAllOrders()
  render()
}

// ================================================================
// SVG LOGO MARK
// ================================================================
function logoMark(size = 40) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
    <path d="M32 8 C18 8 10 20 10 32 C10 46 20 58 32 58 C44 58 54 46 54 32 C54 20 46 8 32 8Z" fill="#f3e0f0"/>
    <path d="M32 14 C21 14 16 23 16 32 C16 43 23 52 32 52 C41 52 48 43 48 32 C48 23 43 14 32 14Z" fill="url(#lg)"/>
    <path d="M32 20 C26 26 24 36 28 44" stroke="rgba(255,255,255,0.5)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="32" cy="10" r="3.5" fill="#e087c0"/>
    <defs><radialGradient id="lg" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#f4b9d7"/><stop offset="100%" stop-color="#9850a0"/></radialGradient></defs>
  </svg>`
}

// ================================================================
// VIEWS
// ================================================================

function vHeader(showAdmin = true) {
  return `<header class="site-header">
    <div class="header-logo">
      ${logoMark(32)}
      <span class="header-brand">Poshan</span>
    </div>
    ${S.adminUser ? `<button class="header-link" data-action="admin-logout">Sign out</button>`
      : showAdmin ? `<button class="header-link" data-action="go-admin">Admin</button>` : ''}
  </header>`
}

function vLanding() {
  const week = S.weeklyMenu ? `<div class="hero-week">🌸 Menu set for ${fmtWeek(S.weeklyMenu.week_start)}</div>` : '<div class="hero-week">⏳ This week\'s menu coming soon</div>'
  return `
  ${vHeader()}
  <div class="page">
    <div class="hero">
      ${logoMark(72)}
      <h1 class="hero-title">Nourishment<br>for <span>two.</span></h1>
      <p class="hero-sub">Fresh Indian tiffins for expecting families in east GTA. Delivered before your day begins.</p>
      ${week}
      <div class="hero-actions">
        <button class="btn btn-primary btn-full" data-action="go-customer">Order This Week's Meals</button>
        <p style="font-size:12px;color:var(--text-light);text-align:center;">Scarborough · Pickering · Ajax · Whitby · Oshawa</p>
      </div>
    </div>
  </div>`
}

function vCustomerForm() {
  const wbMsg = S.welcomeBack ? `<div class="alert alert-success" style="margin-bottom:12px;">👋 Welcome back, ${S.formData.name}! Continuing to your order.</div>` : ''
  return `
  ${vHeader()}
  <div class="page">
    <div style="margin-top:24px;">
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;margin-bottom:4px;">Your details</h2>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:24px;">No account needed. Just your name and phone.</p>
      ${wbMsg}
      ${S.error ? `<div class="alert alert-error">${S.error}</div>` : ''}
      <div class="card">
        <div class="field">
          <label>Your name</label>
          <input type="text" id="inp-name" placeholder="e.g. Priya" autocomplete="name" value="${S.formData.name}" minlength="3" />
          <p class="field-hint">At least 3 characters</p>
        </div>
        <div class="field">
          <label>Phone number</label>
          <input type="tel" id="inp-phone" placeholder="+1 (416) 000-0000" autocomplete="tel" value="${S.formData.phone}" />
          <p class="field-hint" id="phone-hint">At least 10 digits &mdash; we'll find your order next time</p>
        </div>
        <div class="field">
          <label>Email <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-light);">(optional)</span></label>
          <input type="email" id="inp-email" placeholder="you@example.com" autocomplete="email" value="${S.formData.email || ''}" />
          <p class="field-hint">For order confirmations and the weekly menu</p>
        </div>
        <button class="btn btn-primary btn-full ${S.loading ? 'disabled' : ''}" data-action="customer-lookup" ${S.loading ? 'disabled' : ''}>
          ${S.loading ? 'Looking up…' : 'Continue →'}
        </button>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="go-landing" style="margin-top:12px;">← Back</button>
    </div>
  </div>`
}

function vCustomerMenu() {
  const menu = S.weeklyMenu?.menu || {}
  const hasMenu = DAYS.some(d => dayHasMenu(menu[d]))

  if (!hasMenu) {
    return `
    ${vHeader()}
    <div class="page">
      <div class="empty" style="margin-top:60px;">
        <div class="empty-icon">\u{1F371}</div>
        <div class="empty-text">This week's menu hasn't been set yet.<br>Please check back soon!</div>
        <button class="btn btn-ghost btn-sm" data-action="go-landing" style="margin-top:20px;">\u2190 Home</button>
      </div>
    </div>`
  }

  const dayCards = DAYS.map(day => {
    const entry = menu[day]
    const cats  = dayCategories(entry)

    if (!cats.length) return `<div class="day-card no-menu">
      <div class="day-card-header">
        <div class="day-checkbox"></div>
        <div class="day-name">${DAY_LABELS[day]}</div>
        <div class="day-main" style="color:var(--text-light);font-size:13px;">No delivery</div>
      </div>
    </div>`

    const sel   = S.sel.days.has(day)
    const picks = S.sel.choices[day] || {}
    const chosenSummary = picksText(picks) || cats.map(c => c.opts[0]).join(' + ')

    const pickers = cats.map(c => `
      <div style="padding:0 16px 4px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;">
          <span style="font-size:13px;">${c.icon}</span>
          <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--pink-dark);">${c.label}</span>
          <span style="font-size:10px;color:var(--text-light);font-weight:400;letter-spacing:0;text-transform:none;">\u00b7 pick one</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;">
          ${c.opts.map(opt => `
            <label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--text);padding:7px 10px;border-radius:8px;background:${picks[c.key] === opt ? 'rgba(255,255,255,0.85)' : 'transparent'};border:1px solid ${picks[c.key] === opt ? 'var(--pink)' : 'transparent'};">
              <input type="radio" name="${day}-${c.key}" value="${opt}"
                ${picks[c.key] === opt ? 'checked' : ''}
                data-action="choose-option" data-day="${day}" data-cat="${c.key}"
                style="accent-color:var(--pink-dark);width:15px;height:15px;flex-shrink:0;" />
              ${opt}
            </label>`).join('')}
        </div>
      </div>`).join('')

    return `<div class="day-card ${sel ? 'selected' : ''}">
      <div class="day-card-header" data-action="toggle-day" data-day="${day}" style="cursor:pointer;">
        <div class="day-checkbox">
          <svg class="day-check-icon" width="12" height="12" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </div>
        <div class="day-name">${DAY_LABELS[day]}</div>
        <div class="day-dishes">
          <div class="day-main" style="font-size:13px;">${chosenSummary}</div>
          ${!sel ? `<div class="day-side">${cats.length} choice${cats.length !== 1 ? 's' : ''} to make</div>` : ''}
        </div>
      </div>
      ${sel ? pickers : ''}
    </div>`
  }).join('')

  const extrasHtml = S.extras.length ? `
    <div class="section-head"><h3>Extras</h3><p>Add to any delivery day</p></div>
    <div class="extras-grid">
      ${S.extras.map(ex => `<div class="extra-row">
        <div class="extra-info">
          <div class="extra-name">${ex.name}</div>
          ${ex.description ? `<div class="extra-desc">${ex.description}</div>` : ''}
        </div>
        ${ex.price > 0 ? `<div class="extra-price">+$${ex.price.toFixed(2)}</div>` : ''}
        <div class="qty-control">
          <button class="qty-btn" data-action="extra-remove" data-id="${ex.id}">\u2212</button>
          <span class="qty-num">${S.sel.extras[ex.id] || 0}</span>
          <button class="qty-btn" data-action="extra-add" data-id="${ex.id}">+</button>
        </div>
      </div>`).join('')}
    </div>` : ''

  const selectedDays = [...S.sel.days]
  const extrasTotal  = extraTotal()

  const paymentBlock = selectedDays.length > 0 ? `
    <div class="section-head" style="margin-top:20px;"><h3>Payment</h3></div>
    <div class="card" style="border-color:var(--blue);background:var(--blue-light);">
      <div style="font-size:13px;color:#2a5a8a;line-height:1.8;">
        <div style="font-weight:600;margin-bottom:8px;">How to pay</div>
        <div>Send Interac e-Transfer to:</div>
        <div style="font-weight:600;font-size:15px;margin:4px 0;">${CFG.etransfer}</div>
        <div style="color:#4a80b0;font-size:12px;">Message: Poshan - ${S.customer?.name || ''}</div>
        ${CFG.stripeLink ? `<div style="margin-top:10px;"><a href="${CFG.stripeLink}" target="_blank" style="color:#2a5a8a;font-weight:600;">Or pay online via card \u2192</a></div>` : ''}
      </div>
    </div>` : ''

  const summaryHtml = selectedDays.length === 0
    ? `<div class="summary-empty">Select delivery days above</div>`
    : `${selectedDays.map(d => {
        const picks = S.sel.choices[d] || {}
        return `<div class="summary-row" style="align-items:flex-start;"><span style="flex-shrink:0;">${DAY_LABELS[d]}</span><span style="text-align:right;">${picksText(picks) || '\u2014'}</span></div>`
      }).join('')}
     ${Object.entries(S.sel.extras).filter(([,q])=>q>0).map(([id,qty])=>{
       const ex = S.extras.find(e=>e.id===id)
       return `<div class="summary-row"><span>${ex?.name} \u00d7${qty}</span><span>${ex?.price > 0 ? '+$'+(ex.price*qty).toFixed(2) : 'Free'}</span></div>`
     }).join('')}
     <div class="summary-row total"><span>${selectedDays.length} day${selectedDays.length>1?'s':''}</span><span>${extrasTotal > 0 ? `+$${extrasTotal.toFixed(2)} extras` : '\u2713'}</span></div>`

  return `
  ${vHeader(false)}
  <div class="page">
    <div style="margin-top:20px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
        <button class="btn btn-ghost btn-sm" data-action="back-to-form">\u2190</button>
        <p style="font-size:12px;color:var(--text-light);">Week of ${fmtWeek(S.weeklyMenu?.week_start)}</p>
      </div>
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;margin-bottom:4px;">This week's menu</h2>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:14px;">Select your delivery days, ${S.customer?.name || 'friend'}. For each day, pick one iron-rich and one protein-rich dish.</p>

      <div style="background:var(--blue-light);border:1px solid var(--blue);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#2a5a8a;line-height:1.6;margin-bottom:18px;">
        \u{1F35A} ${MEAL_INCLUDES}
      </div>

      ${S.error ? `<div class="alert alert-error">${S.error}</div>` : ''}

      <div class="day-grid">${dayCards}</div>

      ${extrasHtml}

      <div class="section-head" style="margin-top:24px;"><h3>Preferences</h3></div>
      <div class="card">
        <div class="toggle-row">
          <div>
            <div class="toggle-label">\u{1F338} Pregnancy meal plan</div>
            <div class="toggle-sub">Marks your order for pregnancy-specific portioning</div>
          </div>
          <button class="toggle ${S.sel.pregnancy ? 'on' : ''}" data-action="toggle-pregnancy"></button>
        </div>
        <div class="divider"></div>
        <div class="field" style="margin-bottom:0;">
          <label>Special notes</label>
          <textarea id="notes-field" placeholder="Dietary restrictions, spice level, allergies\u2026">${S.sel.notes}</textarea>
        </div>
      </div>

      <div class="section-head" style="margin-top:20px;"><h3>Order summary</h3></div>
      <div class="summary-box">${summaryHtml}</div>

      ${paymentBlock}

      <button class="btn btn-primary btn-full ${S.loading || selectedDays.length === 0 ? 'disabled' : ''}"
        data-action="submit-order" ${S.loading || selectedDays.length === 0 ? 'disabled' : ''}
        style="margin-top:16px;">
        ${S.loading ? 'Placing order\u2026' : selectedDays.length === 0 ? 'Select at least one day' : 'Place Order \u2192'}
      </button>
      <p style="font-size:11px;color:var(--text-light);text-align:center;margin-top:10px;">Send your e-Transfer after placing the order. We'll confirm delivery via phone.</p>
    </div>
  </div>`
}

function vCustomerExisting() {
  const o = S.existingOrder
  if (!o) return vLanding()
  const days = (o.delivery_days || []).map(raw => {
    const { day, picks } = decodeDay(raw)
    const txt = picksText(picks)
    return `<div style="margin-bottom:6px;"><span class="day-chip">${cap(day)}</span>${txt ? `<span style="font-size:12px;color:var(--text-mid);margin-left:7px;">${txt}</span>` : ''}</div>`
  }).join('')
  const extras = (o.extras || []).filter(e => e.qty > 0).map(e => `<div class="summary-row"><span>${e.name} ×${e.qty}</span><span>${e.price > 0 ? '+$'+(e.price*e.qty).toFixed(2) : 'Free'}</span></div>`).join('')
  const statusClass = { pending: 'badge-pending', confirmed: 'badge-confirmed', delivered: 'badge-delivered' }
  return `
  ${vHeader(false)}
  <div class="page">
    <div style="margin-top:24px;">
      <div class="alert alert-info">You've already ordered this week, ${o.customer_name}! Here's your order.</div>
      <div class="card">
        <div class="card-title">Your order</div>
        <div class="card-sub">Week of ${fmtWeek(o.week_start)}</div>
        <div style="margin-bottom:12px;">
          <p style="font-size:12px;color:var(--text-light);margin-bottom:6px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;">Delivery days</p>
          <div class="order-days">${days}</div>
        </div>
        ${o.pregnancy_plan ? `<div style="margin-bottom:12px;"><span class="pregnancy-badge">🌸 Pregnancy plan</span></div>` : ''}
        ${extras ? `<div class="divider"></div><div class="summary-box">${extras}</div>` : ''}
        ${o.notes ? `<div class="divider"></div><p style="font-size:13px;color:var(--text-mid);">📝 ${o.notes}</p>` : ''}
        <div class="divider"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:13px;color:var(--text-mid);">Status</span>
          <span class="badge ${statusClass[o.status] || 'badge-pending'}">${cap(o.status)}</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-full" data-action="go-landing" style="margin-top:12px;">← Back to home</button>
    </div>
  </div>`
}

function vCustomerSuccess() {
  const days = [...S.sel.days].map(d => DAY_LABELS[d] || cap(d)).join(', ')
  return `
  ${vHeader(false)}
  <div class="page">
    <div class="success-wrap">
      <div class="success-icon">🌸</div>
      <h2 class="success-title">Order placed!</h2>
      <p class="success-sub">Thank you, ${S.customer?.name}!<br>Your tiffin is confirmed for <strong>${days}</strong>.<br><br>We'll reach out on your phone to confirm delivery. See you this week! 💕</p>
      <button class="btn btn-primary" data-action="go-landing" style="margin-top:28px;">← Back to home</button>
    </div>
  </div>`
}

function vAdminLogin() {
  return `
  ${vHeader(false)}
  <div class="page">
    <div style="margin-top:40px;">
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;margin-bottom:4px;">Admin login</h2>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:24px;">Poshan kitchen dashboard</p>
      ${S.error ? `<div class="alert alert-error">${S.error}</div>` : ''}
      <div class="card">
        <div class="field">
          <label>Email</label>
          <input type="email" id="admin-email" value="${CFG.adminEmail}" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="admin-password" placeholder="Your Supabase password" />
        </div>
        <button class="btn btn-primary btn-full ${S.loading ? 'disabled' : ''}" data-action="admin-login" ${S.loading ? 'disabled' : ''}>
          ${S.loading ? 'Signing in…' : 'Sign in'}
        </button>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="go-landing" style="margin-top:12px;">← Back</button>
    </div>
  </div>`
}

function vAdminDashboard() {
  const wk = S.adminWeek || weekStart()
  const isCurrent = wk === weekStart()
  const tab = S.adminTab

  return `
  ${vHeader(false)}
  <div class="page-wide">
    <div style="margin-top:20px;margin-bottom:16px;">
      <h2 style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;">Poshan Kitchen</h2>

      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" data-action="week-prev" title="Previous week">\u2190</button>
        <div style="font-size:13px;color:var(--text);font-weight:500;min-width:150px;text-align:center;">
          ${fmtWeek(wk)}
          ${isCurrent ? '<span style="font-size:10px;color:var(--pink-dark);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;display:block;">This week</span>' : ''}
        </div>
        <button class="btn btn-ghost btn-sm" data-action="week-next" title="Next week">\u2192</button>
        ${!isCurrent ? `<button class="btn btn-secondary btn-sm" data-action="week-today">Jump to this week</button>` : ''}
        <span style="font-size:12px;color:var(--text-light);margin-left:4px;">${S.allOrders.length} order${S.allOrders.length !== 1 ? 's' : ''}</span>
      </div>
    </div>

    ${S.msg ? `<div class="alert alert-success">${S.msg}</div>` : ''}
    ${S.error ? `<div class="alert alert-error">${S.error}</div>` : ''}

    <div class="tabs">
      <button class="tab-btn ${tab === 'menu' ? 'active' : ''}" data-action="switch-tab" data-tab="menu">\u{1F4CB} Menu</button>
      <button class="tab-btn ${tab === 'orders' ? 'active' : ''}" data-action="switch-tab" data-tab="orders">\u{1F4E6} Orders (${S.allOrders.length})</button>
      <button class="tab-btn ${tab === 'customers' ? 'active' : ''}" data-action="switch-tab" data-tab="customers">\u{1F465} Customers</button>
      <button class="tab-btn ${tab === 'extras' ? 'active' : ''}" data-action="switch-tab" data-tab="extras">\u2728 Extras</button>
    </div>

    ${tab === 'menu' ? adminMenuTab()
      : tab === 'orders' ? adminOrdersTab()
      : tab === 'customers' ? adminCustomersTab()
      : adminExtrasTab()}
  </div>`
}

function adminMenuTab() {
  const dayForms = DAYS.map(day => {
    const d = S.menuDraft[day] || {}
    // Migrate legacy single-list menus into the iron slot on first edit
    const legacy = d.options || (d.main ? [d.main] : [])
    const iron    = d.iron    || (legacy.length ? legacy : ['', ''])
    const protein = d.protein || ['', '']

    const catBlock = (key, label, icon, vals) => `
      <div style="margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:7px;">
          <span style="font-size:13px;">${icon}</span>
          <span style="font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--pink-dark);">${label}</span>
        </div>
        <div class="input-row">
          <div class="mini-field">
            <input type="text" data-field="menu-cat" data-day="${day}" data-cat="${key}" data-idx="0"
              value="${(vals[0] || '').replace(/"/g,'&quot;')}" placeholder="Option 1" />
          </div>
          <div class="mini-field">
            <input type="text" data-field="menu-cat" data-day="${day}" data-cat="${key}" data-idx="1"
              value="${(vals[1] || '').replace(/"/g,'&quot;')}" placeholder="Option 2" />
          </div>
        </div>
      </div>`

    return `<div class="menu-day-editor">
      <div class="menu-day-label">${DAY_LABELS[day]}</div>
      ${catBlock('iron',    'Iron rich',    '\u{1FA78}', iron)}
      ${catBlock('protein', 'Protein rich', '\u{1F4AA}', protein)}
    </div>`
  }).join('')

  return `<div>
    <div style="background:var(--blue-light);border:1px solid var(--blue);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#2a5a8a;line-height:1.6;margin-bottom:16px;">
      \u{1F35A} ${MEAL_INCLUDES}<br>
      <span style="font-size:11.5px;color:#4a80b0;">Shown automatically to every customer \u2014 no need to repeat it in dish names.</span>
    </div>
    <p style="font-size:13px;color:var(--text-mid);margin-bottom:16px;">
      Give two options per category. Customers pick one iron-rich and one protein-rich dish per day.
      Leave a day blank for no delivery.
    </p>
    ${dayForms}
    <button class="btn btn-primary btn-full ${S.loading ? 'disabled' : ''}" data-action="save-menu" ${S.loading ? 'disabled' : ''} style="margin-top:8px;">
      ${S.loading ? 'Saving\u2026' : '\u2713 Save menu for this week'}
    </button>
  </div>`
}

function adminOrdersTab() {
  if (!S.allOrders.length) return `<div class="empty"><div class="empty-icon">\u{1F4ED}</div><div class="empty-text">No orders for this week.</div></div>`
  return `<div style="overflow-x:auto;">
    <table class="orders-table">
      <thead><tr>
        <th>Customer</th><th>Contact</th><th>Days &amp; dishes</th><th>Extras</th><th>Plan</th><th>Notes</th><th>Status</th>
      </tr></thead>
      <tbody>
        ${S.allOrders.map(o => `<tr>
          <td><strong>${o.customer_name}</strong></td>
          <td style="font-size:12px;">
            ${o.customer_phone}
            ${o.customer_email ? `<div style="color:var(--text-light);font-size:11px;margin-top:2px;">${o.customer_email}</div>` : ''}
          </td>
          <td>
            <div style="display:flex;flex-direction:column;gap:5px;">
              ${(o.delivery_days||[]).map(raw => {
                const { day, picks } = decodeDay(raw)
                const txt = picksText(picks)
                return `<div style="font-size:12px;line-height:1.45;">
                  <span class="day-chip">${cap(day)}</span>
                  ${txt ? `<span style="color:var(--text-mid);margin-left:6px;">${txt}</span>` : ''}
                </div>`
              }).join('')}
            </div>
          </td>
          <td style="font-size:12px;">${(o.extras||[]).filter(e=>e.qty>0).map(e=>`${e.name}\u00d7${e.qty}`).join(', ') || '\u2014'}</td>
          <td>${o.pregnancy_plan ? '<span class="pregnancy-badge">\u{1F338} Pregnancy</span>' : '\u2014'}</td>
          <td style="max-width:150px;font-size:12px;">${o.notes || '\u2014'}</td>
          <td>
            <select class="status-select" data-action="update-status" data-id="${o.id}">
              <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
              <option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option>
              <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
            </select>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`
}

function adminCustomersTab() {
  if (!S.allCustomers.length) return `<div class="empty"><div class="empty-icon">\u{1F465}</div><div class="empty-text">No customers yet.<br><span style="font-size:12px;">They're added automatically when orders come in.</span></div></div>`

  const emails = S.allCustomers.filter(c => c.email).map(c => c.email).join(', ')

  return `<div>
    ${emails ? `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-label">Mailing list \u00b7 ${S.allCustomers.filter(c=>c.email).length} with email</div>
      <textarea readonly style="width:100%;min-height:56px;font-size:12px;color:var(--text-mid);border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--cream);font-family:inherit;">${emails}</textarea>
      <p style="font-size:11px;color:var(--text-light);margin-top:6px;">Copy this into the BCC field when sending the weekly menu.</p>
    </div>` : ''}
    <div style="overflow-x:auto;">
      <table class="orders-table">
        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Orders</th><th>First order</th><th>Last order</th></tr></thead>
        <tbody>
          ${S.allCustomers.map(c => `<tr>
            <td><strong>${c.name || '\u2014'}</strong></td>
            <td style="font-size:12px;">${c.phone}</td>
            <td style="font-size:12px;color:var(--text-mid);">${c.email || '\u2014'}</td>
            <td><span class="day-chip">${c.order_count || 0}</span></td>
            <td style="font-size:12px;color:var(--text-light);">${(c.first_order_at || '').slice(0,10) || '\u2014'}</td>
            <td style="font-size:12px;color:var(--text-light);">${(c.last_order_at || '').slice(0,10) || '\u2014'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`
}

function adminExtrasTab() {
  return `<div>
    <p style="font-size:13px;color:var(--text-mid);margin-bottom:16px;">Manage extras in your Supabase dashboard under the <strong>extras</strong> table. Changes reflect here automatically.</p>
    ${S.extras.length ? `<div class="extras-grid">
      ${S.extras.map(ex => `<div class="extra-row">
        <div class="extra-info"><div class="extra-name">${ex.name}</div>${ex.description ? `<div class="extra-desc">${ex.description}</div>` : ''}</div>
        <div class="extra-price">${ex.price > 0 ? `$${ex.price.toFixed(2)}` : 'Free'}</div>
        <span class="badge ${ex.available ? 'badge-confirmed' : 'badge-pending'}">${ex.available ? 'Live' : 'Hidden'}</span>
      </div>`).join('')}
    </div>` : `<div class="empty"><div class="empty-icon">✨</div><div class="empty-text">No extras yet. Add them in Supabase.</div></div>`}
  </div>`
}

// ================================================================
// RENDER
// ================================================================
function render() {
  const root = document.getElementById('root')
  const views = {
    landing:           vLanding,
    'customer-form':   vCustomerForm,
    'customer-menu':   vCustomerMenu,
    'customer-existing': vCustomerExisting,
    'customer-success':  vCustomerSuccess,
    'admin-login':     vAdminLogin,
    'admin-dashboard': vAdminDashboard
  }
  root.innerHTML = (views[S.view] || vLanding)()
}

// ================================================================
// EVENTS
// ================================================================
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]')
  if (!el) return
  const action = el.dataset.action
  S.error = null; S.msg = null

  if (action === 'go-landing') { history.replaceState(null,'',window.location.pathname); S.view = 'landing'; render() }
  else if (action === 'back-to-form') {
    S.welcomeBack = false
    S.view = 'customer-form'
    render()
  }
  else if (action === 'go-customer') { S.view = 'customer-form'; render() }
  else if (action === 'go-admin') { window.location.hash = 'admin'; S.view = 'admin-login'; render() }

  else if (action === 'toggle-day') {
    const day = el.dataset.day
    if (S.sel.days.has(day)) {
      S.sel.days.delete(day)
      delete S.sel.choices[day]
    } else {
      S.sel.days.add(day)
      // Default every category to its first option so the order is
      // always valid even if the customer doesn't change anything.
      const cats = dayCategories(S.weeklyMenu?.menu?.[day])
      if (!S.sel.choices[day]) S.sel.choices[day] = {}
      cats.forEach(c => {
        if (!S.sel.choices[day][c.key]) S.sel.choices[day][c.key] = c.opts[0]
      })
    }
    render()
  }

  else if (action === 'toggle-pregnancy') {
    const notes = document.getElementById('notes-field')
    if (notes) S.sel.notes = notes.value
    S.sel.pregnancy = !S.sel.pregnancy
    render()
  }

  else if (action === 'week-prev') {
    shiftWeek(-1); await loadAllOrders(); await loadMenuForAdmin(); render()
  }
  else if (action === 'week-next') {
    shiftWeek(1); await loadAllOrders(); await loadMenuForAdmin(); render()
  }
  else if (action === 'week-today') {
    S.adminWeek = weekStart(); await loadAllOrders(); await loadMenuForAdmin(); render()
  }
  else if (action === 'extra-add') {
    const id = el.dataset.id
    S.sel.extras[id] = (S.sel.extras[id] || 0) + 1
    render()
  }
  else if (action === 'extra-remove') {
    const id = el.dataset.id
    if ((S.sel.extras[id] || 0) > 0) S.sel.extras[id]--
    render()
  }

  else if (action === 'customer-lookup') {
    const name = document.getElementById('inp-name')?.value?.trim()
    const phone = document.getElementById('inp-phone')?.value?.trim()
    const email = document.getElementById('inp-email')?.value?.trim()
    const digits = (phone || '').replace(/\D/g, '')
    if (!name || name.length < 3) { S.error = 'Name must be at least 3 characters.'; render(); return }
    if (!phone || digits.length < 10) { S.error = 'Please enter a valid phone number (at least 10 digits).'; render(); return }
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.error = 'That email address doesn\'t look right.'; render(); return }
    S.formData = { name, phone, email }
    S.loading = true; S.customer = { name, phone, email }; render()
    await checkExistingOrder(phone)
    S.loading = false
    if (S.existingOrder) { S.view = 'customer-existing'; render(); return }
    // Returning customer? Prefill name and email from their last order.
    const { data: pastOrders } = await db.from('orders')
      .select('customer_name, customer_email')
      .eq('customer_phone', phone)
      .order('created_at', { ascending: false })
      .limit(1)
    if (pastOrders && pastOrders.length > 0) {
      S.welcomeBack = true
      S.formData.name = pastOrders[0].customer_name
      S.customer.name = pastOrders[0].customer_name
      if (!email && pastOrders[0].customer_email) {
        S.formData.email = pastOrders[0].customer_email
        S.customer.email = pastOrders[0].customer_email
      }
    }
    S.view = 'customer-menu'
    render()
  }

  else if (action === 'submit-order') {
    const notes = document.getElementById('notes-field')
    if (notes) S.sel.notes = notes.value
    if (S.sel.days.size === 0) { S.error = 'Please select at least one delivery day.'; render(); return }
    S.loading = true; render()
    const ok = await submitOrder()
    S.loading = false
    if (ok) { S.view = 'customer-success'; render() }
    else { S.error = 'Something went wrong. Please try again.'; render() }
  }

  else if (action === 'admin-login') {
    const email = document.getElementById('admin-email')?.value?.trim()
    const pass = document.getElementById('admin-password')?.value
    if (!email || !pass) { S.error = 'Please enter email and password.'; render(); return }
    S.loading = true; render()
    const { data, error } = await db.auth.signInWithPassword({ email, password: pass })
    S.loading = false
    if (error) { S.error = 'Login failed. Check your email and password.'; render(); return }
    if (email !== CFG.adminEmail) { await db.auth.signOut(); S.error = 'Not authorised.'; render(); return }
    S.adminUser = data.user
    if (!S.adminWeek) S.adminWeek = weekStart()
    await loadAllOrders()
    await loadMenuForAdmin()
    S.view = 'admin-dashboard'; render()
  }

  else if (action === 'admin-logout') {
    await db.auth.signOut(); S.adminUser = null; history.replaceState(null,'',window.location.pathname); S.view = 'landing'; render()
  }

  else if (action === 'switch-tab') {
    S.adminTab = el.dataset.tab
    if (S.adminTab === 'orders')    await loadAllOrders()
    if (S.adminTab === 'customers') await loadCustomers()
    if (S.adminTab === 'menu')      await loadMenuForAdmin()
    render()
  }

  else if (action === 'save-menu') {
    const draft = {}
    document.querySelectorAll('[data-field="menu-cat"]').forEach(inp => {
      const day = inp.dataset.day, cat = inp.dataset.cat, idx = parseInt(inp.dataset.idx)
      if (!draft[day]) draft[day] = {}
      if (!draft[day][cat]) draft[day][cat] = []
      draft[day][cat][idx] = inp.value.trim()
    })
    // Drop blanks, and drop days with nothing set
    Object.keys(draft).forEach(day => {
      let any = false
      Object.keys(draft[day]).forEach(cat => {
        draft[day][cat] = (draft[day][cat] || []).filter(Boolean)
        if (draft[day][cat].length) any = true
        else delete draft[day][cat]
      })
      if (!any) delete draft[day]
    })
    S.menuDraft = draft

    S.loading = true; render()
    const ok = await saveMenu()
    await loadMenu()
    await loadMenuForAdmin()
    S.loading = false
    if (ok) { S.msg = '\u2713 Menu saved for ' + fmtWeek(S.adminWeek || weekStart()) } else { S.error = 'Save failed. Please try again.' }
    render()
  }
})

document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-action]')
  if (!el) return
  if (el.dataset.action === 'update-status') {
    await updateStatus(el.dataset.id, el.value)
  } else if (el.dataset.action === 'choose-option') {
    const day = el.dataset.day, cat = el.dataset.cat
    if (!S.sel.choices[day]) S.sel.choices[day] = {}
    S.sel.choices[day][cat] = el.value
    render()
  }
})

// Live phone lookup on input
document.addEventListener('input', async (e) => {
  if (e.target.id !== 'inp-phone') return
  const digits = e.target.value.replace(/\D/g, '')
  if (digits.length >= 10) {
    const { data } = await db.from('orders').select('customer_name').eq('customer_phone', e.target.value.trim()).limit(1)
    const hint = document.getElementById('phone-hint')
    if (hint && data && data.length > 0) {
      const nameInp = document.getElementById('inp-name')
      if (nameInp && !nameInp.value) nameInp.value = data[0].customer_name
      hint.innerHTML = "<span style=\"color:var(--green);font-weight:500;\">👋 Welcome back, " + data[0].customer_name + "!</span>"
    } else if (hint) {
      hint.innerHTML = "At least 10 digits - we'll find your order next time"
    }
  }
})

// ================================================================
// BOOT
// ================================================================
async function boot() {
  try {
    render()
    await Promise.all([loadMenu(), loadExtras()])
    const { data: { session } } = await db.auth.getSession()
    if (session?.user?.email === CFG.adminEmail) {
      S.adminUser = session.user
      if (!S.adminWeek) S.adminWeek = weekStart()
      await loadAllOrders()
      await loadMenuForAdmin()
      S.view = 'admin-dashboard'
    } else if (window.location.hash === '#admin') {
      S.view = 'admin-login'
    }
    render()
  } catch(err) {
    console.error('Poshan boot error:', err)
    document.getElementById('root').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdf6fa;font-family:sans-serif;padding:24px;">
        <div style="max-width:400px;text-align:center;">
          <div style="font-size:40px;margin-bottom:12px;">🌸</div>
          <div style="font-size:26px;color:#8a3a6e;font-weight:500;margin-bottom:8px;">Poshan</div>
          <div style="background:#fff;border:1px solid #ead8ea;border-radius:12px;padding:20px;text-align:left;margin-top:16px;">
            <div style="font-weight:600;color:#2a1f2e;margin-bottom:8px;">⚙️ Database not connected yet</div>
            <div style="font-size:13px;color:#7a6080;line-height:1.7;">
              The site is live! The database just needs connecting.<br><br>
              Follow the <strong>SETUP.md</strong> instructions to connect Supabase, then update the 3 config values in index.html.
            </div>
          </div>
          <div style="margin-top:12px;font-size:12px;color:#b0a0b8;">Coming soon to east GTA 💕</div>
        </div>
      </div>`
  }
}

// Boot when page is ready
window.addEventListener('load', function() {
  if (CFG.url === 'YOUR_SUPABASE_URL') {
    document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdf6fa;font-family:sans-serif;padding:24px;text-align:center;"><div><div style="font-size:40px">🌸</div><div style="font-size:26px;color:#8a3a6e;margin:12px 0;font-weight:500">Poshan</div><div style="background:#fff;border:1px solid #ead8ea;border-radius:12px;padding:20px;margin-top:16px;text-align:left;max-width:360px"><div style="font-weight:600;margin-bottom:8px">Setup required</div><div style="font-size:13px;color:#7a6080;line-height:1.7">Add your Supabase URL, key, and admin email to the config at the top of index.html</div></div></div></div>'
    return
  }
  try {
    db = supabase.createClient(CFG.url, CFG.key)
    // Deep link: myposhan.ca/#admin opens the admin screen
    if (window.location.hash === '#admin') S.view = 'admin-login'
    boot()
  } catch(e) {
    document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdf6fa;font-family:sans-serif;padding:24px;text-align:center;"><div style="font-size:14px;color:#c03030">Connection error: ' + e.message + '</div></div>'
  }
})
</script>
