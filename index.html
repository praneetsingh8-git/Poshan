<style>
:root {
  --pink:        #f4b9d7;
  --pink-light:  #fde8f3;
  --pink-dark:   #c06090;
  --pink-deep:   #8a3a6e;
  --blue:        #b4d2f1;
  --blue-light:  #e8f3fd;
  --lilac:       #d4b0e8;
  --lilac-light: #f3e8fd;
  --text:        #2a1f2e;
  --text-mid:    #7a6080;
  --text-light:  #b0a0b8;
  --border:      #ead8ea;
  --cream:       #fdf6fa;
  --white:       #ffffff;
  --green:       #4a8050;
  --green-light: #edfde8;
  --amber:       #ba7517;
  --amber-light: #faeeda;
  --red:         #c03030;
  --red-light:   #fdeaea;
  --radius:      12px;
  --shadow:      0 2px 16px rgba(180,140,180,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Jost', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
}
#root { min-height: 100vh; }

/* ── LAYOUT ── */
.page { max-width: 480px; margin: 0 auto; padding: 24px 16px 80px; }
.page-wide { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

/* ── HEADER ── */
.site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.header-logo {
  display: flex; align-items: center; gap: 10px;
}
.header-mark {
  width: 32px; height: 32px;
}
.header-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 500; color: var(--pink-deep);
}
.header-link {
  font-size: 12px; color: var(--text-light); cursor: pointer;
  text-decoration: underline; background: none; border: none;
  font-family: 'Jost', sans-serif;
}
.header-link:hover { color: var(--pink-dark); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 13px 24px; border-radius: 100px;
  font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 500;
  cursor: pointer; border: none; transition: all 0.15s; text-align: center;
}
.btn-primary {
  background: linear-gradient(135deg, #e87ab0 0%, #b095d0 100%);
  color: var(--white);
  box-shadow: 0 4px 16px rgba(200,120,170,0.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,120,170,0.4); }
.btn-secondary {
  background: var(--white); color: var(--pink-deep);
  border: 1.5px solid var(--pink);
}
.btn-secondary:hover { background: var(--pink-light); }
.btn-ghost {
  background: transparent; color: var(--text-mid);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--white); }
.btn-danger { background: var(--red-light); color: var(--red); border: 1px solid #f0c0c0; }
.btn-sm { padding: 8px 16px; font-size: 12px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* ── CARDS ── */
.card {
  background: var(--white); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 20px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 12px; }
.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 500; color: var(--text);
  margin-bottom: 4px;
}
.card-sub { font-size: 12px; color: var(--text-light); margin-bottom: 16px; }

/* ── FORMS ── */
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-mid); letter-spacing: 0.06em;
  text-transform: uppercase; margin-bottom: 6px;
}
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-family: 'Jost', sans-serif; font-size: 14px; color: var(--text);
  background: var(--white); outline: none; transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus {
  border-color: var(--pink-dark);
}
.field textarea { resize: vertical; min-height: 80px; }
.field-hint { font-size: 11px; color: var(--text-light); margin-top: 4px; }

/* ── HERO ── */
.hero { text-align: center; padding: 48px 20px 32px; }
.hero-mark { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 40px; font-weight: 600; color: var(--text);
  line-height: 1.1; margin-bottom: 8px;
}
.hero-title span { color: var(--pink-dark); font-style: italic; }
.hero-sub { font-size: 14px; color: var(--text-mid); line-height: 1.7; margin-bottom: 32px; max-width: 320px; margin-left: auto; margin-right: auto; }
.hero-actions { display: flex; flex-direction: column; gap: 10px; max-width: 280px; margin: 0 auto; }
.hero-week {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--pink-light); color: var(--pink-deep);
  border-radius: 100px; padding: 6px 14px; font-size: 12px;
  font-weight: 500; margin-bottom: 24px;
}

/* ── DAY CARDS ── */
.day-grid { display: flex; flex-direction: column; gap: 10px; }
.day-card {
  border: 1.5px solid var(--border); border-radius: var(--radius);
  background: var(--white); overflow: hidden; transition: all 0.15s;
}
.day-card.selected { border-color: var(--pink-dark); background: var(--pink-light); }
.day-card.no-menu { opacity: 0.5; pointer-events: none; }
.day-card-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer;
}
.day-checkbox {
  width: 20px; height: 20px; border-radius: 6px;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.day-card.selected .day-checkbox {
  background: var(--pink-dark); border-color: var(--pink-dark);
}
.day-check-icon { display: none; }
.day-card.selected .day-check-icon { display: block; }
.day-name { font-weight: 600; font-size: 14px; flex-shrink: 0; width: 90px; }
.day-dishes { flex: 1; }
.day-main { font-size: 14px; color: var(--text); }
.day-side { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.day-tag {
  font-size: 10px; font-weight: 600; padding: 3px 8px;
  border-radius: 100px; background: var(--pink-light);
  color: var(--pink-dark); flex-shrink: 0;
}

/* ── EXTRAS ── */
.extras-grid { display: flex; flex-direction: column; gap: 8px; }
.extra-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--white);
}
.extra-info { flex: 1; }
.extra-name { font-size: 14px; font-weight: 500; }
.extra-desc { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.extra-price { font-size: 12px; color: var(--pink-dark); font-weight: 500; flex-shrink: 0; }
.qty-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.qty-btn {
  width: 28px; height: 28px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 16px; display: flex;
  align-items: center; justify-content: center; font-weight: 500;
  transition: all 0.1s; color: var(--text-mid);
}
.qty-btn:hover { border-color: var(--pink-dark); color: var(--pink-dark); }
.qty-num { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }

/* ── ORDER SUMMARY ── */
.summary-box {
  background: var(--pink-light); border: 1px solid var(--pink);
  border-radius: var(--radius); padding: 16px; margin-top: 16px;
}
.summary-title { font-size: 12px; font-weight: 600; color: var(--pink-deep); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
.summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.summary-row.total { font-weight: 600; border-top: 1px solid var(--pink); padding-top: 8px; margin-top: 4px; font-size: 14px; }
.summary-empty { font-size: 13px; color: var(--text-light); text-align: center; padding: 8px 0; }

/* ── TOGGLE ── */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-top: 1px solid var(--border);
}
.toggle-label { font-size: 14px; }
.toggle-sub { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.toggle {
  width: 44px; height: 24px; border-radius: 12px;
  background: var(--border); border: none; cursor: pointer;
  position: relative; transition: background 0.2s;
}
.toggle.on { background: var(--pink-dark); }
.toggle::after {
  content: ''; position: absolute; width: 20px; height: 20px;
  border-radius: 50%; background: white; top: 2px; left: 2px;
  transition: transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.toggle.on::after { transform: translateX(20px); }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; background: var(--cream); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
.tab-btn {
  flex: 1; padding: 10px; border: none; border-radius: 10px;
  font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; background: transparent; color: var(--text-mid);
  transition: all 0.15s;
}
.tab-btn.active { background: var(--white); color: var(--pink-deep); box-shadow: var(--shadow); }

/* ── STATUS BADGES ── */
.badge {
  display: inline-flex; align-items: center; padding: 3px 10px;
  border-radius: 100px; font-size: 11px; font-weight: 600;
}
.badge-pending  { background: var(--amber-light); color: var(--amber); }
.badge-confirmed { background: var(--blue-light); color: #2a5a8a; }
.badge-delivered { background: var(--green-light); color: var(--green); }

/* ── ORDERS TABLE (admin) ── */
.orders-table { width: 100%; border-collapse: collapse; }
.orders-table th {
  text-align: left; font-size: 11px; font-weight: 600;
  color: var(--text-light); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
.orders-table td { padding: 12px; border-bottom: 1px solid #f5eef5; font-size: 13px; vertical-align: top; }
.orders-table tr:last-child td { border-bottom: none; }
.orders-table tr:hover td { background: var(--cream); }
.order-days { display: flex; gap: 4px; flex-wrap: wrap; }
.day-chip {
  font-size: 10px; font-weight: 500; padding: 2px 7px;
  border-radius: 6px; background: var(--pink-light); color: var(--pink-deep);
}
.status-select {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 8px; font-size: 12px; font-family: 'Jost', sans-serif;
  background: var(--white); cursor: pointer;
}

/* ── ADMIN MENU EDITOR ── */
.menu-day-editor {
  border: 1.5px solid var(--border); border-radius: var(--radius);
  padding: 16px; background: var(--white); margin-bottom: 10px;
}
.menu-day-label {
  font-weight: 600; font-size: 14px; margin-bottom: 12px;
  color: var(--pink-deep);
}
.input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-field { margin-bottom: 0; }
.mini-field label { font-size: 11px; color: var(--text-light); margin-bottom: 4px; display: block; }
.mini-field input, .mini-field textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  font-family: 'Jost', sans-serif; font-size: 13px; color: var(--text);
  background: var(--cream); outline: none;
}
.mini-field input:focus, .mini-field textarea:focus { border-color: var(--pink-dark); background: var(--white); }

/* ── ALERTS ── */
.alert {
  padding: 12px 16px; border-radius: 10px; font-size: 13px;
  margin-bottom: 16px;
}
.alert-error { background: var(--red-light); color: var(--red); border: 1px solid #f0c0c0; }
.alert-success { background: var(--green-light); color: var(--green); border: 1px solid #c0e0c0; }
.alert-info { background: var(--blue-light); color: #2a5a8a; border: 1px solid var(--blue); }

/* ── LOADING ── */
.loading-wrap { display: flex; align-items: center; justify-content: center; padding: 60px 20px; flex-direction: column; gap: 12px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--pink-dark); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-light); }

/* ── SUCCESS ── */
.success-wrap { text-align: center; padding: 48px 20px; }
.success-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--green-light); display: flex;
  align-items: center; justify-content: center;
  margin: 0 auto 20px; font-size: 28px;
}
.success-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin-bottom: 8px; }
.success-sub { font-size: 14px; color: var(--text-mid); line-height: 1.7; }

/* ── EMPTY STATE ── */
.empty { text-align: center; padding: 40px 20px; color: var(--text-light); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; }

/* ── SECTION HEADERS ── */
.section-head { margin: 24px 0 12px; }
.section-head h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; }
.section-head p { font-size: 12px; color: var(--text-light); margin-top: 2px; }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--border); margin: 20px 0; }

/* ── PREGNANCY BADGE ── */
.pregnancy-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--pink-light); color: var(--pink-deep);
  border-radius: 100px; padding: 4px 10px; font-size: 11px; font-weight: 600;
}
</style>

<script>
// ════════════════════════════════════════════════════════════════════

const CFG = {

// ════════════════════════════════════════════════════════════════════
// CONFIG CHECK
// ════════════════════════════════════════════════════════════════════
const isConfigured = CFG.url !== 'YOUR_SUPABASE_URL' && CFG.key !== 'YOUR_SUPABASE_ANON_KEY'

if (!isConfigured) {

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
const { createClient } = supabase
const db = createClient(CFG.url, CFG.key)
const DAYS = ['monday','tuesday','wednesday','thursday','friday','saturday']
const DAY_LABELS = { monday:'Monday', tuesday:'Tuesday', wednesday:'Wednesday', thursday:'Thursday', friday:'Friday', saturday:'Saturday' }

// ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════
let S = {
  view: 'landing',
  customer: null,
  adminUser: null,
  weeklyMenu: null,
  extras: [],
  sel: { days: new Set(), extras: {}, notes: '', pregnancy: false },
  existingOrder: null,
  allOrders: [],
  adminTab: 'menu',
  menuDraft: {},
  loading: false,
  error: null,
  msg: null
}

// ════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════
function weekStart() {
  const d = new Date()
  const day = d.getDay()
  const diff = d.getDate() - day + (day === 0 ? -6 : 1)
  return new Date(new Date().setDate(diff)).toISOString().split('T')[0]
}

function fmtWeek(ds) {
  if (!ds) return ''
  const d = new Date(ds + 'T12:00:00')
  const e = new Date(d); e.setDate(e.getDate() + 5)
  const opt = { month: 'short', day: 'numeric' }
  return `${d.toLocaleDateString('en-CA', opt)} – ${e.toLocaleDateString('en-CA', opt)}`
}

function cap(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : '' }

function extraTotal() {
  return Object.entries(S.sel.extras).reduce((sum, [id, qty]) => {
    const ex = S.extras.find(e => e.id === id)
    return sum + (ex ? ex.price * qty : 0)
  }, 0)
}

// ════════════════════════════════════════════════════════════════════
// DATA
// ════════════════════════════════════════════════════════════════════
async function loadMenu() {
  const { data } = await db.from('weekly_menu').select('*').eq('week_start', weekStart()).maybeSingle()
  S.weeklyMenu = data
  if (data?.menu) S.menuDraft = JSON.parse(JSON.stringify(data.menu))
}

async function loadExtras() {
  const { data } = await db.from('extras').select('*').eq('available', true).order('name')
  S.extras = data || []
}

async function checkExistingOrder(phone) {
  const { data } = await db.from('orders').select('*').eq('customer_phone', phone).eq('week_start', weekStart()).maybeSingle()
  S.existingOrder = data
}

async function submitOrder() {
  const extrasArr = Object.entries(S.sel.extras).filter(([,q]) => q > 0).map(([id, qty]) => {
    const ex = S.extras.find(e => e.id === id)
    return { id, name: ex?.name || '', qty, price: ex?.price || 0 }
  })
  const { error } = await db.from('orders').insert({
    customer_name: S.customer.name,
    customer_phone: S.customer.phone,
    week_start: weekStart(),
    delivery_days: [...S.sel.days],
    extras: extrasArr,
    pregnancy_plan: S.sel.pregnancy,
    notes: S.sel.notes,
    status: 'pending'
  })
  return !error
}

async function saveMenu() {
  const { error } = await db.from('weekly_menu').upsert({ week_start: weekStart(), menu: S.menuDraft }, { onConflict: 'week_start' })
  return !error
}

async function loadAllOrders() {
  const { data } = await db.from('orders').select('*').eq('week_start', weekStart()).order('created_at', { ascending: false })
  S.allOrders = data || []
}

async function updateStatus(id, status) {
  await db.from('orders').update({ status }).eq('id', id)
  await loadAllOrders()
  render()
}

// ════════════════════════════════════════════════════════════════════
function logoMark(size = 40) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
    <path d="M32 8 C18 8 10 20 10 32 C10 46 20 58 32 58 C44 58 54 46 54 32 C54 20 46 8 32 8Z" fill="#f3e0f0"/>
    <path d="M32 14 C21 14 16 23 16 32 C16 43 23 52 32 52 C41 52 48 43 48 32 C48 23 43 14 32 14Z" fill="url(#lg)"/>

function render() {
  const root = document.getElementById('root')
  const views = {
    landing:           vLanding,
    'customer-form':   vCustomerForm,
    'customer-menu':   vCustomerMenu,
    'customer-existing': vCustomerExisting,
    'customer-success':  vCustomerSuccess,

  }
  root.innerHTML = (views[S.view] || vLanding)()
}

// ════════════════════════════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════════════════════════════
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]')
  if (!el) return
  const action = el.dataset.action
  S.error = null; S.msg = null

  if (action === 'go-landing') { S.view = 'landing'; render() }
  else if (action === 'go-customer') { S.view = 'customer-form'; render() }
  else if (action === 'go-admin') { S.view = 'admin-login'; render() }

  else if (action === 'toggle-day') {
    const day = el.dataset.day
    if (S.sel.days.has(day)) S.sel.days.delete(day)
    else S.sel.days.add(day)
    render()
  }

  else if (action === 'toggle-pregnancy') {
    const notes = document.getElementById('notes-field')
    if (notes) S.sel.notes = notes.value
    S.sel.pregnancy = !S.sel.pregnancy
    render()
  }

  else if (action === 'extra-add') {
    const id = el.dataset.id
    S.sel.extras[id] = (S.sel.extras[id] || 0) + 1
    render()
  }
  else if (action === 'extra-remove') {
    const id = el.dataset.id
    if ((S.sel.extras[id] || 0) > 0) S.sel.extras[id]--
    render()
  }

  else if (action === 'customer-lookup') {
    const name = document.getElementById('inp-name')?.value?.trim()
    const phone = document.getElementById('inp-phone')?.value?.trim()
    if (!name || !phone) { S.error = 'Please enter your name and phone number.'; render(); return }
    S.loading = true; S.customer = { name, phone }; render()
    await checkExistingOrder(phone)
    S.loading = false
    S.view = S.existingOrder ? 'customer-existing' : 'customer-menu'
    render()
  }

  else if (action === 'submit-order') {
    const notes = document.getElementById('notes-field')
    if (notes) S.sel.notes = notes.value
    if (S.sel.days.size === 0) { S.error = 'Please select at least one delivery day.'; render(); return }
    S.loading = true; render()
    const ok = await submitOrder()
    S.loading = false
    if (ok) { S.view = 'customer-success'; render() }
    else { S.error = 'Something went wrong. Please try again.'; render() }
  }

  else if (action === 'admin-login') {
    const email = document.getElementById('admin-email')?.value?.trim()
    const pass = document.getElementById('admin-password')?.value
    if (!email || !pass) { S.error = 'Please enter email and password.'; render(); return }
    S.loading = true; render()
    const { data, error } = await db.auth.signInWithPassword({ email, password: pass })
    S.loading = false
    if (error) { S.error = 'Login failed. Check your email and password.'; render(); return }
    if (email !== CFG.adminEmail) { await db.auth.signOut(); S.error = 'Not authorised.'; render(); return }
    S.adminUser = data.user
    await loadAllOrders()
    S.view = 'admin-dashboard'; render()
  }

  else if (action === 'admin-logout') {
    await db.auth.signOut(); S.adminUser = null; S.view = 'landing'; render()
  }

  else if (action === 'switch-tab') {
    S.adminTab = el.dataset.tab
    if (S.adminTab === 'orders') await loadAllOrders()
    render()
  }

  else if (action === 'save-menu') {
    // Collect menu draft from inputs
    document.querySelectorAll('[data-field^="menu-"]').forEach(inp => {
      const field = inp.dataset.field.replace('menu-', '')
      const day = inp.dataset.day
      if (!S.menuDraft[day]) S.menuDraft[day] = {}
      S.menuDraft[day][field] = inp.value.trim()
    })
    S.loading = true; render()
    const ok = await saveMenu()
    await loadMenu()
    S.loading = false
    if (ok) { S.msg = '✓ Menu saved successfully!' } else { S.error = 'Save failed. Please try again.' }
    render()
  }
})

document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-action]')
  if (!el) return
  if (el.dataset.action === 'update-status') {
    await updateStatus(el.dataset.id, el.value)
  }
})

// BOOT
// ════════════════════════════════════════════════════════════════════
async function boot() {
  try {
    render()
    await Promise.all([loadMenu(), loadExtras()])
    const { data: { session } } = await db.auth.getSession()
    if (session?.user?.email === CFG.adminEmail) {
      S.adminUser = session.user
      await loadAllOrders()
      S.view = 'admin-dashboard'
    }
    render()
  } catch(err) {
    console.error('Poshan boot error:', err)
    document.getElementById('root').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdf6fa;font-family:sans-serif;padding:24px;">
